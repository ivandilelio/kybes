name: kit-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Dipendenze di test
        run: pip install sqlalchemy pyyaml pglast tree-sitter tree-sitter-c-sharp
      - name: Validazione del plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate ./marketplace || echo "validazione non disponibile in CI"
      - name: Suite del kit
        run: tests/run.sh
