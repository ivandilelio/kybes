table: Ordini
description: Testata degli ordini
columns:
  - name: Id
    type: uuid
    primary_key: true
  - name: Numero
    type: string
    length: 20
    required: true
    unique: true
  - name: ClienteId
    type: uuid
    required: true
  - name: Stato
    type: string
    length: 12
    required: true
    default: aperto
  - name: Data
    type: date
    required: true
  - name: Totale
    type: decimal
    precision: 14
    scale: 2
    required: true
    default: 0
  - name: Note
    type: text
  - name: CreatoIl
    type: datetime
    generated: on_create
relations:
  - name: Cliente
    kind: many_to_one
    target: Clienti
    foreign_key: ClienteId
    on_delete: restrict
  - name: Righe
    kind: one_to_many
    target: RigheOrdine
    foreign_key: OrdineId
indexes:
  - columns: [Data]
queries:
  - name: DelClienteDal
    where:
      - ClienteId
      - { column: Data, op: gte, param: DaData }
    order_by: [{ column: Data, dir: desc }]
  - name: ApertiDelCliente
    where:
      - ClienteId
      - { column: Stato, op: eq, value: aperto }
    order_by: [{ column: Data, dir: desc }]
  - name: PerNumero
    where:
      - { column: Numero, op: prefix, param: Prefisso }
    order_by: [Numero]
  - name: UltimoDelCliente
    where: [ClienteId]
    order_by: [{ column: Data, dir: desc }]
    returns: one
pagination:
  default_order: [{ column: Data, dir: desc }]
  sortable: [Data, Numero, Totale]
  max_limit: 200
transactions:
  isolation: repeatable_read
verification:
  asil: C
