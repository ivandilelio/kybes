table: Prodotti
description: Catalogo prodotti
tenancy: none                   # catalogo condiviso da tutte le Organization
columns:
  - name: Id
    type: int
    primary_key: true
  - name: Codice
    type: string
    length: 30
    required: true
    unique: true
  - name: Descrizione
    type: string
    length: 255
    required: true
  - name: CategoriaId
    type: int
  - name: Attributi
    type: json
relations:
  - name: Categoria
    kind: many_to_one
    target: Categorie
    foreign_key: CategoriaId
    on_delete: set_null
queries:
  - name: SenzaCategoria
    where:
      - { column: CategoriaId, op: is_null }
    returns: list
  - name: PerCodici
    where:
      - { column: Codice, op: in, param: Codici }
    returns: list
api: true
