# Libreria DB-Models (Python): il codice in src/model è generato da kybes dagli schemi in schemas/db.
# Le function e i microservizi la importano a build time con versione/tag.
[project]
name = "db-models"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["sqlalchemy>=2.0"]

[project.optional-dependencies]
# test di unità generati (tests/generated) e custom (tests/custom), copertura per le soglie ASIL
# (con le API REST anche FastAPI e httpx per il test dell'adattatore)
test = ["pytest>=8", "pytest-cov>=5", "fastapi>=0.110", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]
# collection MongoDB (storage: mongo)
mongo = ["pymongo>=4.6"]
# adattatore FastAPI delle API REST generate (src/api); Lambda e ASGI non richiedono dipendenze
fastapi = ["fastapi>=0.110"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["src/model", "src/api"]
