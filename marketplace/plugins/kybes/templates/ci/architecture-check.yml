name: architecture-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  arch-check:
    runs-on: ubuntu-latest
    # PostgreSQL di test per i test generati (Java e C# lo richiedono; Python e TypeScript lo usano se KYBES_TEST_DATABASE_URL è impostato)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kybes
          POSTGRES_PASSWORD: kybes
          POSTGRES_DB: kybes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kybes" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Modello generato aggiornato (schemas/db → model, test, JSON Schema, MODEL_INDEX.md)
        run: python3 -B tools/kybes/plugins/kybes/scripts/gen/gen.py . --check
      - name: Regole architetturali, struttura e duplicati
        run: python3 -B tools/kybes/plugins/kybes/scripts/arch_check.py . --strict
      - uses: actions/setup-node@v4
        if: hashFiles('libs/db-models/typescript/package.json') != ''
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        if: hashFiles('libs/db-models/java/pom.xml') != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: libs/db-models/java/pom.xml
      - uses: actions/setup-dotnet@v4
        if: hashFiles('libs/db-models/csharp/tests/*.csproj') != ''
        with:
          dotnet-version: "8.0.x"
      - name: MongoDB con replica set per le collection (storage: mongo)
        run: |
          if grep -rqsE '^storage:[[:space:]]*mongo' schemas/db; then
            docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
            for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' >/dev/null 2>&1 && break; sleep 1; done
            docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
            for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 1; done
            echo "KYBES_TEST_MONGO_URL=mongodb://localhost:27017/?replicaSet=rs0" >> "$GITHUB_ENV"
          fi
      - name: Dipendenze dei test del modello
        run: |
          if [ -f libs/db-models/python/pyproject.toml ]; then pip install -e "libs/db-models/python[test,postgres,mongo]"; fi
          if [ -f jobs/generated/_engine/pyproject.toml ]; then pip install -e "jobs/generated/_engine[test]"; fi
          if [ -f libs/db-models/typescript/package.json ]; then (cd libs/db-models/typescript && npm install --no-audit --no-fund); fi
      - name: Test di unità del modello e copertura per ASIL (ISO 26262-6), su PostgreSQL (e MongoDB per le collection)
        env:
          KYBES_TEST_DATABASE_URL: postgresql://kybes:kybes@localhost:5432/kybes
        run: python3 -B tools/kybes/plugins/kybes/scripts/verify.py .
      - name: Evidenze di verifica (report di copertura e specifiche dei test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            coverage/*.cobertura.xml
            coverage/*.jacoco.xml
            docs/generated/verification/
          if-no-files-found: ignore
