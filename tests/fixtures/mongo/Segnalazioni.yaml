# Collection MongoDB: stessa interfaccia delle tabelle SQL (fase 6).
table: Segnalazioni
description: Segnalazioni dei clienti
storage: mongo
tenancy: column
columns:
  - { name: Id, type: uuid, primary_key: true }
  - { name: Codice, type: string, length: 20, required: true, unique: true }
  - { name: Titolo, type: string, length: 120, required: true }
  - { name: Priorita, type: int, required: true, default: 3 }
  - { name: Stato, type: string, length: 12, required: true, default: aperta }
  - { name: Importo, type: decimal, precision: 12, scale: 2 }
  - { name: Riferimento, type: string, length: 30, unique: true }
  - { name: Dettagli, type: json }
  - { name: Scadenza, type: date }
  - { name: Volume, type: bigint }
  - { name: Urgente, type: bool, required: true, default: false }
  - { name: ApertaIl, type: datetime, generated: on_create }
  - { name: AggiornataIl, type: datetime, generated: on_update }
relations:
  - { name: Note, kind: one_to_many, target: NoteSegnalazione, foreign_key: SegnalazioneId }
queries:
  - name: ApertePerPriorita
    where:
      - { column: Stato, op: eq, value: aperta }
      - { column: Priorita, op: gte, param: DaPriorita }
    order_by: [{ column: Priorita, dir: desc }]
  - name: PerTitolo
    where:
      - { column: Titolo, op: prefix, param: Prefisso }
    order_by: [Titolo]
  - name: SenzaScadenza
    where:
      - { column: Scadenza, op: is_null }
      - { column: Stato, op: ne, value: chiusa }
      - { column: Priorita, op: in, param: Priorita }
    returns: list
  - name: UltimaConImporto
    where:
      - { column: Importo, op: not_null }
      - { column: Importo, op: lt, param: Massimo }
    order_by: [{ column: Codice, dir: desc }]
    returns: one
pagination:
  default_order: [{ column: Priorita, dir: desc }]
  sortable: [Priorita, Titolo, Codice]
verification:
  asil: C
